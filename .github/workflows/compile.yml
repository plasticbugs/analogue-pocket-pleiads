################################################################################
# Build the Pleiads / Phoenix Pocket core.
#
# The cheap checks run first and independently: linting, the reciprocal
# constants, the reference renderer and the RTL against MAME's frozen states.
# Only then is a twenty-minute Quartus compile spent. METHODOLOGY section 8:
# verify anything verifiable before spending a build.
################################################################################
name: Compile Core

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint the RTL
        run: ./sim/lint.sh

      - name: Verify the reciprocal constants are exact
        run: python3 tools/gen_recip.py --check

      # The video regression, the palette check and the audio benches all need
      # ROM data, which must never be committed. They run locally and are not
      # covered here. Saying so in the job summary matters: a green tick that
      # quietly skipped its most important check is worse than a red one,
      # because it reads as coverage that does not exist.
      - name: State what is and is not covered
        run: |
          {
            echo "### What this run checked"
            echo ""
            echo "| check | status |"
            echo "|---|---|"
            echo "| RTL lint | ran |"
            echo "| reciprocal constants exhaustively exact | ran |"
            echo "| Quartus synthesis and fit | ran |"
            echo "| timing closure | ran |"
            echo "| frozen-state video regression | **not run — needs ROM data** |"
            echo "| palette LUT against MAME | **not run — needs ROM data** |"
            echo "| audio against MAME | **not run — needs ROM data** |"
            echo ""
            echo "The three that do not run here are the ones held directly"
            echo "against MAME. They require a romset, which is never committed,"
            echo "so they run locally before a release. See docs/measurements.md."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm the verification corpus is present
        run: |
          n=$(ls artifacts/*/state_*.txt 2>/dev/null | wc -l)
          m=$(ls artifacts/*/mame_*.png 2>/dev/null | wc -l)
          echo "frozen states: $n, MAME snapshots: $m"
          # These were silently absent for every run before this check existed,
          # because an unanchored gitignore pattern swallowed the directories.
          if [ "$n" -lt 14 ] || [ "$m" -lt 14 ]; then
            echo "::error::verification corpus is incomplete ($n states, $m snapshots)"
            exit 1
          fi

  compile:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space (the Quartus image needs ~18 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/graalvm
          sudo docker image prune --all --force
          df -h /

      - name: Compile with Quartus 18.1
        run: |
          docker run --rm -v "$PWD":/build -w /build/projects \
            raetro/quartus:pocket \
            quartus_sh --flow compile pleiads_pocket

      - name: Resource summary
        run: cat projects/output_files/pleiads_pocket.fit.summary || true

      - name: Timing must be met
        run: |
          sta=projects/output_files/pleiads_pocket.sta.summary
          test -f "$sta" || { echo "::error::no timing summary"; exit 1; }
          echo "--- slack on every clock and corner ---"
          grep -E "^Type|^Slack|^TNS" "$sta" | paste - - - | sed 's/Type  : //'
          # Test the numbers, not a message. An earlier version grepped the
          # full report for "Timing requirements not met", which is a phrase
          # that may or may not appear; a negative slack always does.
          if grep -q -- "Slack : -" "$sta"; then
            echo "::error::timing not met"
            grep -B2 -- "Slack : -" "$sta" | head -12
            exit 1
          fi
          echo "timing met on every clock at every corner"

      - name: Package for the SD card
        run: python3 package-pocket.py

      # package-pocket.py writes to release/pocket, not pkg/. Uploading pkg/**
      # shipped every definition file and no bitstream, which went unnoticed
      # while releases were cut locally.
      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: pleiads-pocket
          path: release/pocket/**
          if-no-files-found: error

      # The raw bitstream and its timing report, so a release can be cut from
      # this exact build with tools/cut-release.sh.
      - name: Upload the bitstream
        uses: actions/upload-artifact@v4
        with:
          name: pleiads-bitstream
          path: |
            projects/output_files/pleiads_pocket.rbf
            projects/output_files/pleiads_pocket.sta.summary
          if-no-files-found: error
